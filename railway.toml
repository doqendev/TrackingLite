[deploy]
# Give the container plenty of time to start (prisma migrate + Next.js startup)
healthcheckPath = "/api/health"
healthcheckTimeout = 30
# Wait up to 120s for the container to become healthy before giving up
startCommand = "sh -c 'npx prisma migrate deploy 2>&1 || true; exec node .next/standalone/server.js'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
